<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101210">
<meta name="description" content="영상 색보정을 하는 윤지환의 포트폴리오. 단편 영화, 뮤직비디오, 브랜드 필름, 다큐멘터리 작업을 소개합니다.">
<title>윤지환 영상 포트폴리오</title>
<!-- 링크 공유 미리보기(카카오톡, 슬랙, 페이스북 등). og:image 와 og:url 은 전체 주소여야 하므로 도메인이 바뀌면 함께 고칩니다. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="jihwan.yoon">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="윤지환 영상 포트폴리오">
<meta property="og:description" content="영상 색보정을 하는 윤지환의 포트폴리오. 단편 영화, 뮤직비디오, 브랜드 필름, 다큐멘터리 작업을 소개합니다.">
<meta property="og:url" content="https://cocoajonmat.github.io/jihwan-portfolio/">
<meta property="og:image" content="https://cocoajonmat.github.io/jihwan-portfolio/assets/og-image.jpg">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="720">
<meta property="og:image:alt" content="SHOWREEL ColorbyDavid">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23101210'/%3E%3Crect x='10' y='22' width='22' height='20' fill='%23ecece6'/%3E%3Crect x='32' y='22' width='22' height='20' fill='%23e8a24a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=IBM+Plex+Mono:wght@400&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 상세·연락 화면 뒤에 깔리는 흐린 배경 -->
<div class="veil" id="veil" aria-hidden="true"></div>

<header class="top">
  <!-- 이름: 마우스를 올리면 연락처 카드로 확장, 누르면 연락 화면 -->
  <a class="id" id="id" href="#contact" aria-label="Contact">
    <span class="id-row">
      <b class="mark" id="mark"></b>
      <span class="id-plus" aria-hidden="true">+</span>
    </span>
    <span class="id-more">
      <span class="id-in">
        <span class="id-name" id="id-name"></span>
        <span class="mono id-role" id="id-role"></span>
        <span class="id-bio" id="id-bio"></span>
        <span class="id-list">
          <span class="mono">Email</span><span id="id-email"></span>
          <span class="mono">Tel</span><span id="id-phone"></span>
        </span>
        <span class="mono id-go"><span data-i18n="id_go"></span> <span aria-hidden="true">→</span></span>
      </span>
    </span>
  </a>

  <div class="top-right">
    <nav class="cats" id="cats" aria-label="Fields"></nav>
    <span class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ko" aria-pressed="true">KO</button><span aria-hidden="true">/</span><button type="button" data-lang="en" aria-pressed="false">EN</button>
    </span>
  </div>
</header>

<main>
  <!-- 홈 화면 + 작품 목록 (한 페이지로 이어서 스크롤) -->
  <div id="view-home">
    <section class="home" id="top" aria-label="Home">
      <div class="home-bg" id="home-bg" aria-hidden="true"></div>
      <div class="home-shade" aria-hidden="true"></div>
      <p class="mono tc" aria-hidden="true"><i class="rec"></i><span id="tc">00:00:00:00</span><span class="fps">24 FPS</span></p>
      <p class="mono home-topline"><span>D.I</span><span id="topline-year">PORTFOLIO</span></p>
      <button type="button" class="bg-pause" id="bg-pause" aria-pressed="false"><span class="ic-bars" aria-hidden="true"></span><span class="ic-play" aria-hidden="true"></span></button>
      <div class="home-title"><h1 id="home-name"></h1></div>
      <div class="home-foot">
        <div class="now-stack">
          <button type="button" class="watch-btn" id="watch-reel" data-reel><span class="ic-tri" aria-hidden="true"></span><span data-i18n="watch"></span><span class="mono" aria-hidden="true">↗</span></button>
          <div class="now" id="now">
            <span class="mono" id="now-meta"></span>
            <strong id="now-title"></strong>
          </div>
        </div>
        <a class="works-btn" id="works-btn" href="#work"><span class="mono">WORKS</span><span class="chev" aria-hidden="true">↓</span></a>
      </div>
    </section>

    <section class="work" id="work" aria-label="Works">
      <nav class="cat-strip" id="cat-strip" aria-label="Fields"></nav>
      <div class="work-meta">
        <h2 class="work-title">Selected<br><span>work<i>.</i></span></h2>
        <p class="mono" id="work-count"></p>
      </div>
      <ul class="mosaic" id="mosaic"></ul>
      <footer class="foot">
        <span class="mono" id="foot-copy"></span>
        <a class="mono" href="#contact" data-i18n="foot_contact"></a>
        <a class="mono" href="#top" data-i18n="to_top"></a>
      </footer>
    </section>
  </div>

  <!-- 작품 상세 -->
  <div id="view-film" hidden>
    <article class="detail" aria-labelledby="film-title">
      <section class="d-hero">
        <div class="stage-box">
          <div class="cmp-wrap" id="cmp-wrap"></div>
          <div class="d-info">
            <div>
              <p class="mono" id="d-no"></p>
              <h1 id="film-title"></h1>
              <p class="d-line" id="d-line"></p>
            </div>
            <a class="back-btn" href="#work"><span aria-hidden="true">←</span> <span data-i18n="back"></span></a>
          </div>
        </div>
        <p class="mono scroll-hint"><span data-i18n="scroll_info"></span> <span aria-hidden="true">↓</span></p>
      </section>

      <section class="d-body">
        <p class="summary" id="film-summary"></p>
        <div class="d-cols">
          <div>
            <h2 class="mono" data-i18n="credits_title"></h2>
            <dl class="credit-list" id="credit-list"></dl>
          </div>
          <div>
            <h2 class="mono" data-i18n="pal_title"></h2>
            <ul class="pal" id="pal"></ul>
          </div>
        </div>
        <div class="strip-head">
          <h2 class="mono" data-i18n="strip_title"></h2>
          <p class="mono" data-i18n="strip_hint"></p>
        </div>
        <ul class="strip" id="strip"></ul>
        <a class="next" id="next" href="#work">
          <span class="mono" data-i18n="next"></span>
          <strong id="next-title"></strong>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </section>
    </article>
  </div>

  <!-- 연락 화면 -->
  <div id="view-contact" hidden>
    <section class="contact" aria-labelledby="c-name">
      <div class="c-card">
        <p class="mono" data-i18n="contact_label"></p>
        <h1 id="c-name"></h1>
        <p class="mono c-role" id="c-role"></p>
        <p class="c-bio" id="c-bio"></p>
        <dl class="c-list" id="c-list"></dl>
        <a class="back-btn" href="#top"><span aria-hidden="true">←</span> <span data-i18n="c_back"></span></a>
      </div>
    </section>
  </div>
</main>

<div class="modal" id="reel-modal" role="dialog" aria-modal="true" aria-labelledby="reel-title" hidden>
  <div class="modal-box">
    <div class="modal-head"><p class="mono" id="reel-title">SHOWREEL</p><button type="button" class="icon-btn" data-close aria-label="Close">×</button></div>
    <div class="modal-body" id="reel-body"></div>
  </div>
</div>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Still viewer" hidden>
  <p class="mono lb-count" id="lb-count"></p>
  <button type="button" class="icon-btn lb-close" aria-label="Close">×</button>
  <button type="button" class="icon-btn lb-nav lb-prev" id="lb-prev" aria-label="Previous">←</button>
  <img id="lb-img" alt="">
  <button type="button" class="icon-btn lb-nav lb-next" id="lb-next" aria-label="Next">→</button>
  <p class="mono lb-keys">← → / ESC</p>
</div>

<script src="projects.js"></script>
<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
